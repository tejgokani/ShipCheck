rules:
  - id: SEC-504
    name: Hallucinated Package Import
    severity: medium
    languages: ["typescript", "javascript", "python"]
    description: >
      AI invents plausible-sounding package names that don't exist on npm or
      PyPI. These fail at install time but can also become supply-chain attack
      vectors if someone registers the name after the AI "creates" it.
      Common examples: @openai/utils, @anthropic/sdk (should be @anthropic-ai/sdk),
      react-auth-hooks, langchain-tools.

  - id: SEC-601
    name: Package with Known CVE
    severity: high
    languages: ["json", "yaml", "python"]
    description: >
      AI pins specific package versions copied from old documentation, tutorials,
      or example repos. These pinned versions may have publicly known CVEs.
      shipcheck checks against a bundled list of high-impact vulnerabilities
      updated on each release — no network call required.
    bundled_cves:
      - package: lodash
        fixed_at: "4.17.21"
        cve: CVE-2021-23337
        summary: command injection via template
      - package: axios
        fixed_at: "0.21.1"
        cve: CVE-2020-28168
        summary: SSRF via crafted URL
      - package: jsonwebtoken
        fixed_at: "9.0.0"
        cve: CVE-2022-23529
        summary: remote code execution
      - package: Pillow
        fixed_at: "9.0.0"
        cve: CVE-2022-22816
        summary: buffer overflow in path_getbbox
      - package: Django
        fixed_at: "3.2.19"
        cve: CVE-2023-31047
        summary: file upload bypass
      - package: requests
        fixed_at: "2.28.0"
        cve: CVE-2023-32681
        summary: credential leak on redirect

  - id: SEC-602
    name: Overprivileged npm Script
    severity: medium
    languages: ["json"]
    description: >
      AI scaffolds build and install scripts that require elevated privileges
      or use unsafe shell patterns. Common in Dockerfiles and CI config
      generated by AI assistants. Patterns flagged: sudo, chmod 777,
      curl|sh, wget|sh, rm -rf /.
