rules:
  - id: SEC-101
    name: Generic API Key
    severity: critical
    languages: ["*"]
    description: >
      AI hardcodes API keys when it hits auth errors and needs something
      that "works now." Common in scaffolding where credentials are
      copy-pasted from docs.

  - id: SEC-102
    name: OpenAI API Key
    severity: critical
    languages: ["*"]
    description: >
      Hardcoded OpenAI sk-proj- or sk- key. AI agents working on OpenAI
      integrations often hardcode a key to test, then forget to move it
      to an env var.

  - id: SEC-103
    name: Anthropic API Key
    severity: critical
    languages: ["*"]
    description: >
      Hardcoded Anthropic sk-ant-api03- key. Same pattern as OpenAI —
      AI hardcodes during initial implementation.

  - id: SEC-104
    name: Stripe Secret Key
    severity: critical
    languages: ["*"]
    description: >
      Live Stripe secret key (sk_live_) committed to source. AI-generated
      payment integrations commonly inline the key from environment
      setup steps.

  - id: SEC-105
    name: Supabase Service Role Key
    severity: critical
    languages: ["*"]
    description: >
      Supabase service_role key bypasses all Row Level Security policies.
      AI often uses it to "fix" permission errors rather than setting up
      proper RLS.

  - id: SEC-106
    name: JWT Placeholder Secret
    severity: critical
    languages: ["*"]
    description: >
      JWT signed with a placeholder secret like "secret" or "your-secret".
      AI copies these directly from documentation examples and framework
      boilerplate.

  - id: SEC-107
    name: SendGrid API Key
    severity: critical
    languages: ["*"]
    description: >
      Hardcoded SendGrid SG. API key. Common in AI-generated email
      sending code where the key is inlined during development.

  - id: SEC-108
    name: Database URL with Credentials
    severity: critical
    languages: ["*"]
    description: >
      Database connection string with username and password embedded.
      AI generates these for convenience during scaffolding.

  - id: SEC-110
    name: GitHub Personal Access Token
    severity: critical
    languages: ["*"]
    description: >
      GitHub PAT (ghp_ or github_pat_) committed to source. AI often
      hardcodes these when building GitHub integrations or CI scripts.
